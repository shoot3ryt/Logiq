<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Logiq</title>
<style>
  :root { --bg:#0b0d17; --card:#151937; --line:#232850; --text:#eef0ff; --muted:#9aa0c7; --accent:#6c7bff; --accent-2:#b06cff; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .box { max-width: 460px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 40px 28px; }
  .logo {
    width: 52px; height: 52px; border-radius: 15px; margin: 0 auto 18px; display: grid; place-items: center;
    font-weight: 900; font-size: 26px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  h1 { font-size: 24px; margin-bottom: 10px; }
  p { color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  a {
    display: inline-block; padding: 12px 22px; border-radius: 12px; font-weight: 700; color: #fff; text-decoration: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
</style>
</head>
<body>
  <main class="box">
    <div class="logo">L</div>
    <h1>Dashboard in arrivo</h1>
    <p>Il pannello di gestione con accesso tramite Discord è in costruzione. Intanto puoi configurare il bot con i comandi slash.</p>
    <a href="/">Torna alla homepage</a>
  </main>
</body>
</html>
